name: uplink

on:
  push:
    paths:
      - "uplink/**"
      - ".github/workflows/uplink.yml"
  pull_request:
    paths:
      - "uplink/**"
      - ".github/workflows/uplink.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: uplink
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: uplink/go.mod
          cache-dependency-path: uplink/go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uplink
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: uplink/go.mod
          cache: false
      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o ll-uplink-linux-amd64 ./cmd/ll-uplink
      - name: Checksum
        run: sha256sum ll-uplink-linux-amd64 > ll-uplink-linux-amd64.sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ll-uplink-linux-amd64 ll-uplink-linux-amd64.sha256 --clobber
