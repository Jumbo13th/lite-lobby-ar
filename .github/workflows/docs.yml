name: Guide website

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated website to GitHub Pages
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Set up npm
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate production website
        run: npm run validate
      - name: Upload validation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: website-validation-failure
          path: docs/.validation-results
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload website for publication
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
          retention-days: 1

  deploy:
    name: Publish website
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
